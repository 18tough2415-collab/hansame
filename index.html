<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#272923"><title>한샘몰 — 더 나은 집을 위한 선택 · 로컬 데모</title><link rel="stylesheet" href="style.css"></head>
<body>
<main id="slides" aria-label="한샘의 특별한 혜택"></main>
<header class="topbar"><button class="mini-logo" aria-label="홈으로"><img src="assets/logo.svg" alt="HANSSEM"></button><nav class="tools" aria-label="주요 메뉴"></nav></header>
<div class="brand"><button id="home" aria-label="한샘 홈"><img src="assets/logo.svg" alt="HANSSEM 한샘"></button><nav class="brand-nav"><button data-menu="0" aria-expanded="false">가구/홈리빙</button><span></span><button data-menu="1" aria-expanded="false">인테리어</button></nav></div>
<nav class="pagination" aria-label="배너 페이지"></nav>
<div class="slide-controls"><span id="slide-count"></span><button id="play" aria-label="자동 재생 일시정지">Ⅱ</button></div>
<aside class="promotion" aria-label="프로모션"><button id="popup-image" aria-label="프로모션 자세히 보기"><img alt="한샘 프로모션" src="assets/popup-0.jpg"><span id="popup-count">1 / 3</span></button><div class="popup-footer"><button id="hide-today">오늘 하루 보지 않기</button><button id="close-popup">닫기</button></div></aside>
<section id="mega" hidden aria-label="전체 카테고리"><div class="mega-tabs"></div><div class="mega-content"></div><button class="mega-close" aria-label="메뉴 닫기">×</button></section>
<dialog id="modal"><button class="modal-close" aria-label="닫기">×</button><div id="modal-content"></div></dialog><div id="toast" role="status"></div>
<script type="module" src="app.js"></script></body></html>
